<line x1="270" y1="50" x2="270" y2="174" stroke="#0b0b0b" stroke-width="2.2"/>
<line x1="40" y1="174" x2="270" y2="174" stroke="#0b0b0b" stroke-width="2.2"/>
<text x="274" y="194" font-size="11" fill="#5b6a80" text-anchor="start">外框</text>
<rect x="86" y="54" width="184" height="120" rx="0" fill="none" stroke="#2f6fdf" stroke-width="2.4"/>
<rect x="274" y="54" width="19.0" height="120" rx="0" fill="#dcefd9" opacity="0.7"/>
<text x="24" y="226" font-size="12" fill="#52514e" text-anchor="start">找到的格子（蓝框）右边半格的窄条里：</text>
<text x="24" y="246" font-size="13" fill="#2f7a3b" text-anchor="start" font-weight="600">没有格线 → 右边就是外框</text>
<text x="344" y="30" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="700">整体偏左一列</text>
<rect x="344" y="46" width="296" height="166" rx="3" fill="#f6f1e4" stroke="#e2dccb" stroke-width="1"/>
<line x1="360" y1="54" x2="590" y2="54" stroke="#9fb0c4" stroke-width="0.9"/>
