<line x1="548" y1="174" x2="567.0" y2="174" stroke="#d4483b" stroke-width="2.4"/>
<text x="344" y="226" font-size="12" fill="#52514e" text-anchor="start">找到的格子（蓝框）右边半格的窄条里：</text>
<text x="344" y="246" font-size="13" fill="#d4483b" text-anchor="start" font-weight="600">还接着格线 → 不是数据区，挪锚点再试</text>
<text x="24" y="278" font-size="13" fill="#0b0b0b" text-anchor="start">格子整体偏一列时，格线照样能吸附上，格线找到的比例也照样高；外框外面的窄条能把它分出来。</text>
<text x="24" y="298" font-size="13" fill="#52514e" text-anchor="start">照片有透视时外框是斜的，所以每一行看这一行自己的右框，每一列看这一列自己的底框。</text>
</svg>