<rect x="360" y="54" width="184" height="120" rx="0" fill="none" stroke="#2f6fdf" stroke-width="2.4"/>
<rect x="548" y="54" width="19.0" height="120" rx="0" fill="#fde2dd" opacity="0.7"/>
<line x1="548" y1="54" x2="567.0" y2="54" stroke="#d4483b" stroke-width="2.4"/>
