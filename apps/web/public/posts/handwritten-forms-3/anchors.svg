<text x="24" y="278" font-size="13" fill="#0b0b0b" text-anchor="start">从第一个锚点外侧半格出发，找到第一条竖线；之后每一步按最近几格的格距往后推，在推到的位置附近</text>
<text x="24" y="298" font-size="13" fill="#0b0b0b" text-anchor="start">找线、吸附上去。格线是周期性的，整个网格挪一格也几乎处处对得上，所以只用第一个锚点定起点。</text>
<text x="24" y="318" font-size="13" fill="#52514e" text-anchor="start">测点名一列同样只用第一个，从上往下走。</text>
