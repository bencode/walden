<text x="476" y="40" font-size="13" fill="#52514e" text-anchor="start">① 窄带里一行的暗像素</text>
<text x="476" y="59" font-size="13" fill="#52514e" text-anchor="start">过半，记为候选（灰线）</text>
<text x="476" y="100" font-size="13" fill="#52514e" text-anchor="start">② 每条带挑出等距的一组</text>
<text x="476" y="119" font-size="13" fill="#52514e" text-anchor="start">（蓝点）；标题、签字栏</text>
<text x="476" y="138" font-size="13" fill="#52514e" text-anchor="start">的线间距不合，不选</text>
<text x="476" y="176" font-size="13" fill="#2f7a3b" text-anchor="start">③ 两条带的表头底线、</text>
<text x="476" y="195" font-size="13" fill="#2f7a3b" text-anchor="start">表底线各连一条直线；</text>
<text x="476" y="214" font-size="13" fill="#2f7a3b" text-anchor="start">首尾都落在线上的带留下</text>
<text x="476" y="252" font-size="13" fill="#d4483b" text-anchor="start">✕ 这条带的表底线被污迹</text>
<text x="476" y="271" font-size="13" fill="#d4483b" text-anchor="start">遮断，等距的一组从表头</text>
<text x="476" y="290" font-size="13" fill="#d4483b" text-anchor="start">顶线开始，错了一行；</text>
<text x="476" y="309" font-size="13" fill="#d4483b" text-anchor="start">首尾不在线上，排除</text>
<text x="476" y="358" font-size="13" fill="#2f6fdf" text-anchor="start">④ 两条带之间的任意位置，</text>
<text x="476" y="377" font-size="13" fill="#2f6fdf" text-anchor="start">逐条插值（空心点）</text>
<text x="26" y="440" font-size="12" fill="#8c8a83" text-anchor="start">图里只画了 6 行、7 条带；实际在整个宽度上每隔一小段放一条窄带</text>
</svg>