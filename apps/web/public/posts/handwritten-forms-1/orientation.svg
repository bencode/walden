<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 406" width="680" height="406" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
<title>方向判断：缩小的图转出四个方向，各问一次是否正立，恰好一个回答「是」时才转</title>
<defs><marker id="arrow-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52514e"/></marker><marker id="arrow-d4483b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d4483b"/></marker><marker id="arrow-2f7a3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f7a3b"/></marker><marker id="arrow-2f6fdf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fdf"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="405" rx="8" fill="#fcfcfb" stroke="#d9d6cf"/>
<text x="24" y="34" font-size="14" fill="#52514e" text-anchor="start">照片是横着拍的。把缩小的图转出四个方向，每个方向各问一次「印刷文字现在是正立的吗」</text>
<g transform="translate(103.0 150) rotate(-90)"><rect x="-50" y="-62" width="100" height="124" rx="2" fill="#f6f1e4" stroke="#e2dccb"/><text x="0" y="-40" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="600">产品报废单</text><line x1="-44" y1="-24" x2="44" y2="-24" stroke="#9fb0c4" stroke-width="0.6"/><line x1="-44" y1="-12" x2="44" y2="-12" stroke="#9fb0c4" stroke-width="0.6"/><line x1="-44" y1="0" x2="44" y2="0" stroke="#9fb0c4" stroke-width="0.6"/><line x1="-44" y1="12" x2="44" y2="12" stroke="#9fb0c4" stroke-width="0.6"/><line x1="-44" y1="24" x2="44" y2="24" stroke="#9fb0c4" stroke-width="0.6"/><line x1="-44" y1="36" x2="44" y2="36" stroke="#9fb0c4" stroke-width="0.6"/><line x1="-44" y1="-24" x2="-44" y2="36" stroke="#9fb0c4" stroke-width="0.6"/><line x1="0" y1="-24" x2="0" y2="36" stroke="#9fb0c4" stroke-width="0.6"/><line x1="20" y1="-24" x2="20" y2="36" stroke="#9fb0c4" stroke-width="0.6"/><line x1="44" y1="-24" x2="44" y2="36" stroke="#9fb0c4" stroke-width="0.6"/><text x="-40" y="-14" font-size="8" fill="#1f3a6b" font-family="'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif">3105体L</text><text x="2" y="-14" font-size="8" fill="#1f3a6b" font-family="'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif">54</text><text x="-40" y="-2" font-size="8" fill="#1f3a6b" font-family="'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif">2280支架</text><text x="2" y="-2" font-size="8" fill="#1f3a6b" font-family="'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif">60</text><text x="-40" y="10" font-size="8" fill="#1f3a6b" font-family="'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif">4417钳体</text><text x="2" y="10" font-size="8" fill="#1f3a6b" font-family="'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif">38</text><text x="22" y="-14" font-size="8" fill="#1f3a6b" font-family="'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif">程立新</text><text x="22" y="10" font-size="8" fill="#1f3a6b" font-family="'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif">秦海波</text><text x="-44" y="52" font-size="7" fill="#5b6a80">检验：</text></g>
<text x="103.0" y="232" font-size="14" fill="#52514e" text-anchor="middle">转 0°（原图）</text>
<text x="103.0" y="262" font-size="16" fill="#0b0b0b" text-anchor="middle">正立？否</text>
