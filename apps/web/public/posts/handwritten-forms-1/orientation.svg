<text x="261.0" y="262" font-size="16" fill="#2f7a3b" text-anchor="middle" font-weight="700">正立？是</text>
<text x="261.0" y="284" font-size="13" fill="#2f7a3b" text-anchor="middle" font-weight="600">采用</text>
