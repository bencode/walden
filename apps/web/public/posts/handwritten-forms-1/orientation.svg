<text x="40" y="332" font-size="14" fill="#0b0b0b" text-anchor="start">恰好一个方向回答「是」：转到这个方向再识别。</text>
<text x="40" y="360" font-size="14" fill="#52514e" text-anchor="start">两个以上回答「是」，或一个也没有：判断不出来，按原图识别，不拒收。</text>
