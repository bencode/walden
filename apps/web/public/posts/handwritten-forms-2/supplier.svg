<rect x="450" y="92" width="100" height="240" rx="0" fill="none" stroke="#d9d6cf" stroke-width="1"/>
<text x="24" y="372" font-size="14" fill="#52514e" text-anchor="start">「213」是手写的 Z13（Z 常被读成 2）。第 4 行属于第二段，却填成了上一段的 Z07：</text>
<text x="24" y="393" font-size="14" fill="#52514e" text-anchor="start">这是分段边界错。Z07 也是这张单上的代码，也在厂商表里，校验发现不了；</text>
<text x="24" y="414" font-size="14" fill="#52514e" text-anchor="start">这一列定稿后不标黄，没有人会再看这一格。</text>
</svg>