<text x="460" y="212.0" font-size="16" fill="#0b0b0b" text-anchor="start">Z07</text>
<line x1="450" y1="224" x2="550" y2="224" stroke="#d9d6cf" stroke-width="0.8"/>
<rect x="453" y="227" width="94" height="30" rx="2" fill="none" stroke="#d4483b" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="460" y="248.0" font-size="16" fill="#0b0b0b" text-anchor="start">Z07</text>
<text x="560" y="247.0" font-size="13" fill="#d4483b" text-anchor="start">应为 Z13</text>
<line x1="450" y1="260" x2="550" y2="260" stroke="#d9d6cf" stroke-width="0.8"/>
