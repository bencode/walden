<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 524" width="680" height="524" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
<title>订正：单据文字和程序查好的资料交给文字模型一次调用，每个待定格返回一个值和理由，筛选后填进黄格，格子仍标黄</title>
